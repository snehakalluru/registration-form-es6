<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration Form | Prototype and ES6 Validation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(15, 23, 42, 0.86), rgba(20, 83, 45, 0.78)),
          url("./static/Sneha.logo.jpg") center/220px repeat;
      }

      .app-shell {
        max-width: 1120px;
      }

      .brand-logo {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 8px;
      }

      .panel {
        border: 0;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
      }

      .form-control,
      .form-select,
      .btn {
        border-radius: 8px;
      }

      .form-text {
        min-height: 1.25rem;
      }

      .invalid-feedback {
        display: block;
        min-height: 1.25rem;
      }

      .table-responsive {
        min-height: 290px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container app-shell">
        <a class="navbar-brand d-flex align-items-center gap-3 fw-semibold" href="#">
          <img src="./static/Sneha.logo.jpg" alt="Logo" class="brand-logo" />
          Registration Form
        </a>
        <span class="badge text-bg-success">Phase 2: ES6 Classes</span>
      </div>
    </nav>

    <main class="container app-shell py-4 py-lg-5">
      <div id="showmessage"></div>

      <div class="row g-4 align-items-start">
        <section class="col-lg-5">
          <div class="panel bg-white p-4">
            <h1 class="h4 mb-1">Create Account</h1>
            <p class="text-secondary mb-4">
              Enter valid user details. Errors appear beside each field.
            </p>

            <form id="registerform" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="name"
                  id="name"
                  placeholder="Example: Sneha Ravi"
                  autocomplete="name"
                />
                <div class="invalid-feedback" id="nameError"></div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  id="email"
                  placeholder="name@example.com"
                  autocomplete="email"
                />
                <div class="invalid-feedback" id="emailError"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  id="password"
                  placeholder="Minimum 8 characters"
                  autocomplete="new-password"
                />
                <div class="form-text">
                  Use uppercase, lowercase, number, and special character.
                </div>
                <div class="invalid-feedback" id="passwordError"></div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input
                  type="password"
                  class="form-control"
                  name="confirmPassword"
                  id="confirmPassword"
                  placeholder="Re-enter password"
                  autocomplete="new-password"
                />
                <div class="invalid-feedback" id="confirmPasswordError"></div>
              </div>

              <div class="mb-4">
                <span class="form-label d-block">Gender</span>
                <div class="form-check form-check-inline">
                  <input
                    type="radio"
                    class="form-check-input"
                    name="gender"
                    id="inlinemale"
                    value="Male"
                  />
                  <label class="form-check-label" for="inlinemale">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    type="radio"
                    class="form-check-input"
                    name="gender"
                    id="inlinefemale"
                    value="Female"
                  />
                  <label class="form-check-label" for="inlinefemale">Female</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    type="radio"
                    class="form-check-input"
                    name="gender"
                    id="inlineother"
                    value="Other"
                  />
                  <label class="form-check-label" for="inlineother">Other</label>
                </div>
                <div class="invalid-feedback" id="genderError"></div>
              </div>

              <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
          </div>
        </section>

        <section class="col-lg-7">
          <div class="panel bg-white p-4">
            <div class="d-flex flex-column flex-md-row gap-3 justify-content-between mb-3">
              <div>
                <h2 class="h4 mb-1">Registered Users</h2>
                <p class="text-secondary mb-0">Saved in browser local storage.</p>
              </div>
              <form class="d-flex gap-2" id="searchForm" role="search">
                <input
                  class="form-control"
                  type="search"
                  id="searchInput"
                  placeholder="Search users"
                  aria-label="Search users"
                />
                <button class="btn btn-outline-success" type="submit">Search</button>
              </form>
            </div>

            <div class="table-responsive">
              <table class="table align-middle">
                <thead class="table-success">
                  <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Gender</th>
                    <th scope="col">Action</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
              <p class="text-center text-secondary py-4 mb-0" id="emptyState">
                No users registered yet.
              </p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./scriptes6.js"></script>
    <!-- Phase 1 prototype version is available in script.js. Change the script above to ./script.js to test it. -->
  </body>
</html>
